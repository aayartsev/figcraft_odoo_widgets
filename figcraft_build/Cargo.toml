[package]
name = "figcraft_build"
version = "0.1.0"
edition = "2021"
description = "Validate Odoo widget catalog (native FigCraft JSON)"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "figcraft_build"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
figcraft-doc = { git = "https://github.com/storytold/figcraft", rev = "4acc293c2ec941ac1400837ee7e3ab51780399f8" }
figcraft-format = { git = "https://github.com/storytold/figcraft", rev = "4acc293c2ec941ac1400837ee7e3ab51780399f8" }
jsonschema = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
