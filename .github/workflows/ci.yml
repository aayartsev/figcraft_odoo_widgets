name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Test figcraft_build
        run: cargo test -p figcraft_build
